spring:
  application:
    name: "configserver"

  profiles:
    active: git
  cloud:
    config:
      server:

        #native:
         # search-locations: "file:///D://Microservice//documents//config"
        git:
          uri: "https://github.com/yogeshsutar63/bank-config.git"
          default-label: master
          timeout: 5
          clone-on-start: true
          force-pull: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
encrypt:
  key: "34DFAF32432DFAG234343DGASDFAFF"
server:
  port: 8071


logging:
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"
